name: Android Wheels & Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_wheels.yml"
      - "install_pydantic_core.sh"
      - "README.md"

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if release exists"
        required: false
        default: false
        type: boolean

      specific_version:
        description: "Build a specific pydantic-core version"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 */6 * * *"

env:
  PACKAGE_NAME: pydantic-core
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "24"
  CMDLINE_TOOLS_VERSION: "11076708"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

permissions:
  contents: write

jobs:
  check-version:
    name: Check PyPI Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should_build: ${{ steps.release.outputs.should_build }}
      commit_hash: ${{ steps.commit.outputs.commit_hash }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get PyPI Version
        id: pypi
        shell: bash
        env:
          SPECIFIC_VER: ${{ inputs.specific_version }}
        run: |
          set -euo pipefail

          if [[ -n "${SPECIFIC_VER:-}" ]]; then
            VERSION="$SPECIFIC_VER"
            echo "Using requested version: $VERSION"
          else
            echo "Fetching latest version from PyPI..."

            VERSION="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 5 \
                --connect-timeout 30 \
                "https://pypi.org/pypi/${PACKAGE_NAME}/json" |
              python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)
          print(data["info"]["version"])
          '
            )"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "❌ Failed to determine package version"
            exit 1
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.pypi.outputs.version }}"
          TAG="v${VERSION}"

          if [[ "${FORCE_BUILD:-false}" == "true" ]]; then
            echo "⚠️ Force build enabled"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "✅ Release $TAG already exists"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "🔨 Release $TAG does not exist"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Commit Hash
        id: commit
        shell: bash
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} / Python ${{ matrix.python-version }}

    needs:
      - check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

        arch:
          - arm64-v8a
          - armeabi-v7a

        include:
          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            ndk_lib_arch: aarch64-linux-android

          - arch: armeabi-v7a
            rust_target: armv7-linux-androideabi
            ndk_lib_arch: arm-linux-androideabi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --proto "=https" \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs |
            sh -s -- -y

          source "$HOME/.cargo/env"

          rustup target add "${{ matrix.rust_target }}"

          echo "Rust:"
          rustc --version

          echo "Cargo:"
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.arch }}-
            cargo-${{ runner.os }}-

      - name: Cache Android Command Line Tools
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/cmdline-tools/latest
          key: android-cmdline-${{ runner.os }}-${{ env.CMDLINE_TOOLS_VERSION }}

      - name: Cache Android SDK Components
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/ndk/${{ env.NDK_VERSION }}
            ~/android-sdk/platforms/android-${{ env.ANDROID_API }}
            ~/android-sdk/platform-tools
          key: android-sdk-v2-${{ runner.os }}-${{ env.NDK_VERSION }}-api-${{ env.ANDROID_API }}
          restore-keys: |
            android-sdk-v2-${{ runner.os }}-${{ env.NDK_VERSION }}-

      - name: Setup Android Command Line Tools
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_DIR="$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_DIR/bin/sdkmanager"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "========================================="
          echo "Android Command Line Tools"
          echo "========================================="

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Downloading Android command-line tools..."

            rm -rf "$CMDLINE_DIR"
            rm -rf /tmp/android-cmdline-tools
            rm -f /tmp/cmdline-tools.zip

            mkdir -p /tmp/android-cmdline-tools

            curl -fL \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              "$CMDLINE_TOOLS_URL" \
              -o /tmp/cmdline-tools.zip

            unzip -q \
              /tmp/cmdline-tools.zip \
              -d /tmp/android-cmdline-tools

            if [[ ! -d "/tmp/android-cmdline-tools/cmdline-tools" ]]; then
              echo "❌ Invalid Android command-line tools archive"
              find /tmp/android-cmdline-tools \
                -maxdepth 4 \
                -type f \
                -print
              exit 1
            fi

            mv \
              /tmp/android-cmdline-tools/cmdline-tools \
              "$CMDLINE_DIR"
          else
            echo "✓ Android command-line tools found in cache"
          fi

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "❌ sdkmanager not found"
            echo "$SDKMANAGER"
            exit 1
          fi

          echo
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "========================================="
          echo "Accepting Android SDK Licenses"
          echo "========================================="

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "❌ sdkmanager not found"
            exit 1
          fi

          set +o pipefail

          for i in $(seq 1 100); do
            printf 'y\n'
          done | "$SDKMANAGER" --licenses

          LICENSE_RESULT=$?

          set -o pipefail

          if [[ $LICENSE_RESULT -ne 0 ]]; then
            echo "❌ Failed to accept Android SDK licenses"
            exit 1
          fi

          echo "✓ Android SDK licenses accepted"

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"
          PLATFORM_DIR="$ANDROID_HOME/platforms/android-${ANDROID_API}"
          PLATFORM_TOOLS_DIR="$ANDROID_HOME/platform-tools"

          echo "========================================="
          echo "Installing Android SDK Components"
          echo "========================================="

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "❌ sdkmanager not found"
            exit 1
          fi

          echo
          echo "Installing:"
          echo "  platform-tools"
          echo "  platforms;android-${ANDROID_API}"
          echo "  ndk;${NDK_VERSION}"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}"

          echo
          echo "========================================="
          echo "Verifying Android Installation"
          echo "========================================="

          if [[ ! -d "$PLATFORM_DIR" ]]; then
            echo "❌ Android API ${ANDROID_API} platform not found"

            echo
            echo "Available platforms:"
            find "$ANDROID_HOME/platforms" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print 2>/dev/null || true

            exit 1
          fi

          if [[ ! -d "$NDK_DIR" ]]; then
            echo "❌ NDK ${NDK_VERSION} not found"

            echo
            echo "Available NDKs:"
            find "$ANDROID_HOME/ndk" \
              -maxdepth 1 \
              -mindepth 1 \
              -type d \
              -print 2>/dev/null || true

            exit 1
          fi

          if [[ ! -x "$PLATFORM_TOOLS_DIR/adb" ]]; then
            echo "❌ platform-tools not found"
            exit 1
          fi

          echo "✓ Android API ${ANDROID_API}"
          echo "✓ NDK ${NDK_VERSION}"
          echo "✓ platform-tools"

          echo
          echo "NDK information:"
          cat "$NDK_DIR/source.properties"

          echo
          echo "Setting environment variables..."

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Android Toolchain Verification"
          echo "========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo
          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo
          echo "clang:"
          "$NDK_BIN/clang" --version

          case "${{ matrix.arch }}" in
            arm64-v8a)
              CLANG_TARGET="aarch64-linux-android${ANDROID_API}"
              ;;

            armeabi-v7a)
              CLANG_TARGET="armv7a-linux-androideabi${ANDROID_API}"
              ;;

            *)
              echo "❌ Unsupported architecture"
              exit 1
              ;;
          esac

          CLANG="$NDK_BIN/${CLANG_TARGET}-clang"

          echo
          echo "Target clang:"
          echo "$CLANG"

          if [[ ! -x "$CLANG" ]]; then
            echo "❌ Target clang not found"
            exit 1
          fi

          echo "✓ Android toolchain ready"

      - name: Build Wheel
        id: build_step
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          PY_VER="${{ matrix.python-version }}"
          PKG_VER="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          RUST_TARGET="${{ matrix.rust_target }}"
          NDK_LIB_ARCH="${{ matrix.ndk_lib_arch }}"

          export ANDROID_API_LEVEL="${ANDROID_API}"

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          export PATH="$NDK_BIN:$PATH"

          case "$ARCH" in
            arm64-v8a)
              CC_TARGET="aarch64-linux-android${ANDROID_API_LEVEL}"
              ;;

            armeabi-v7a)
              CC_TARGET="armv7a-linux-androideabi${ANDROID_API_LEVEL}"
              ;;

            *)
              echo "❌ Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          echo "========================================="
          echo "Building pydantic-core"
          echo "========================================="
          echo "Version:       $PKG_VER"
          echo "Architecture:  $ARCH"
          echo "Python:        $PY_VER"
          echo "Rust target:   $RUST_TARGET"
          echo "CC target:     $CC_TARGET"
          echo "Android API:   $ANDROID_API_LEVEL"
          echo "========================================="

          CLANG="$NDK_BIN/${CC_TARGET}-clang"

          if [[ ! -x "$CLANG" ]]; then
            echo "❌ Clang wrapper not found:"
            echo "$CLANG"
            exit 1
          fi

          LINKER_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"

          export "${LINKER_VAR}=$CLANG"

          echo
          echo "Linker:"
          echo "${!LINKER_VAR}"

          MOCK_DIR="$(pwd)/mock_libs"

          mkdir -p "$MOCK_DIR"

          echo
          echo "Creating mock libpython${PY_VER}.so..."

          "$NDK_BIN/clang" \
            --target="$CC_TARGET" \
            -shared \
            -Wl,-soname,libpython${PY_VER}.so \
            -o "$MOCK_DIR/libpython${PY_VER}.so" \
            -xc /dev/null

          echo "✓ Mock libpython created"

          echo
          echo "Finding libdl.so..."

          LIBDL_PATH="$(
            find "$NDK_SYSROOT" \
              -path "*${NDK_LIB_ARCH}*" \
              -name "libdl.so" |
            head -n 1
          )"

          if [[ -z "$LIBDL_PATH" ]]; then
            echo "❌ Could not find libdl.so"

            find "$NDK_SYSROOT" \
              -name "libdl.so" \
              -print | head -50

            exit 1
          fi

          echo "libdl:"
          echo "$LIBDL_PATH"

          cp "$LIBDL_PATH" "$MOCK_DIR/libdl.so"

          echo
          echo "Creating Python sysconfig..."

          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"

          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<'PYEOF'
          build_time_vars = {
              'abiflags': '',
              'ABIFLAGS': '',
              'SO': '.so',
              'SOABI': 'cpython-PYVER_PLACEHOLDER',
              'EXT_SUFFIX': '.so',
              'LIBDIR': 'MOCKDIR_PLACEHOLDER',
              'LDLIBRARY': 'libpythonPYVER_PLACEHOLDER.so',
              'Py_ENABLE_SHARED': 1,
              'CC': 'clang',
              'CXX': 'clang++',
              'VERSION': 'PYVER_PLACEHOLDER',
              'LDSHARED': 'clang -shared',
              'LDFLAGS': '-LMOCKDIR_PLACEHOLDER',
              'CCSHARED': '-fPIC',
              'GNULD': 'yes',
              'Py_DEBUG': 0,
              'WITH_PYMALLOC': 1,
          }
          PYEOF

          sed -i \
            -e "s|PYVER_PLACEHOLDER|$PY_VER|g" \
            -e "s|MOCKDIR_PLACEHOLDER|$MOCK_DIR|g" \
            "$MOCK_DIR/${SYSCONFIG_NAME}.py"

          echo "Sysconfig:"
          cat "$MOCK_DIR/${SYSCONFIG_NAME}.py"

          echo
          echo "Downloading pydantic-core source..."

          mkdir -p build_src
          cd build_src

          SOURCE_URL="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              "https://pypi.org/pypi/${PACKAGE_NAME}/${PKG_VER}/json" |
            python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          urls = [
              item["url"]
              for item in data["urls"]
              if item["packagetype"] == "sdist"
          ]

          if not urls:
              raise SystemExit("No sdist found")

          print(urls[0])
          '
          )"

          if [[ -z "$SOURCE_URL" ]]; then
            echo "❌ Could not find source URL"
            exit 1
          fi

          echo "Source URL:"
          echo "$SOURCE_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$SOURCE_URL" \
            -o source.tar.gz

          tar -xzf source.tar.gz

          SOURCE_DIR="$(
            find . \
              -maxdepth 1 \
              -type d \
              -name 'pydantic_core-*' |
            head -n 1
          )"

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "❌ pydantic_core source directory not found"
            exit 1
          fi

          cd "$SOURCE_DIR"

          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"
          export PYTHONPATH="$MOCK_DIR${PYTHONPATH:+:$PYTHONPATH}"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"

          RUSTFLAGS_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"

          export "${RUSTFLAGS_VAR}=-L native=$MOCK_DIR \
          -C link-arg=--target=$CC_TARGET \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython$PY_VER \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          echo
          echo "PYO3_CROSS_LIB_DIR:"
          echo "$PYO3_CROSS_LIB_DIR"

          echo
          echo "PYO3_CROSS_PYTHON_VERSION:"
          echo "$PYO3_CROSS_PYTHON_VERSION"

          echo
          echo "Building wheel..."

          maturin build \
            --release \
            --strip \
            --target "$RUST_TARGET" \
            --interpreter "python${PY_VER}" \
            --skip-auditwheel

          cd target/wheels

          shopt -s nullglob

          WHEELS=( *.whl )

          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "❌ No wheel generated"
            exit 1
          fi

          echo
          echo "Generated wheels:"

          for WHEEL in "${WHEELS[@]}"; do
            echo "  $WHEEL"
          done

          echo
          echo "Normalizing wheel names..."

          for OLD in "${WHEELS[@]}"; do
            NEW="$OLD"

            case "$ARCH" in
              arm64-v8a)
                NEW="$(echo "$OLD" | sed -E 's/-linux_aarch64\.whl$/.whl/')"
                ;;

              armeabi-v7a)
                NEW="$(echo "$OLD" | sed -E 's/-linux_armv7l\.whl$/.whl/')"
                ;;
            esac

            if [[ "$OLD" != "$NEW" ]]; then
              echo "$OLD -> $NEW"
              mv "$OLD" "$NEW"
            fi
          done

          echo
          echo "Final wheels:"

          shopt -s nullglob
          FINAL_WHEELS=( *.whl )

          for WHEEL in "${FINAL_WHEELS[@]}"; do
            echo "  $WHEEL"
            ls -lh "$WHEEL"
          done

          if [[ ${#FINAL_WHEELS[@]} -eq 0 ]]; then
            echo "❌ No final wheels found"
            exit 1
          fi

          echo "WHEEL_DIR=$(pwd)" >> "$GITHUB_OUTPUT"

      - name: Validate Wheel Names
        shell: bash
        run: |
          set -euo pipefail

          WHEEL_DIR="${{ steps.build_step.outputs.WHEEL_DIR }}"

          shopt -s nullglob

          WHEELS=( "$WHEEL_DIR"/*.whl )

          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "❌ No wheels found"
            exit 1
          fi

          for WHEEL in "${WHEELS[@]}"; do
            NAME="$(basename "$WHEEL")"

            echo
            echo "Checking:"
            echo "$NAME"

            if [[ "$NAME" =~ -cp[0-9]+-cp[0-9]+-android_24_(arm64_v8a|armeabi_v7a)\.whl$ ]]; then
              echo "✓ Valid Android wheel"
            else
              echo "❌ Invalid wheel name:"
              echo "$NAME"
              exit 1
            fi
          done

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-${{ matrix.arch }}
          path: ${{ steps.build_step.outputs.WHEEL_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release

    needs:
      - check-version
      - build

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download All Wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: Validate Release Wheels
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          WHEELS=( wheels/*.whl )

          echo "========================================="
          echo "Release Wheels"
          echo "========================================="

          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "❌ No wheels found"
            exit 1
          fi

          for WHEEL in "${WHEELS[@]}"; do
            NAME="$(basename "$WHEEL")"

            echo
            echo "$NAME"
            ls -lh "$WHEEL"

            if [[ ! "$NAME" =~ -cp[0-9]+-cp[0-9]+-android_24_(arm64_v8a|armeabi_v7a)\.whl$ ]]; then
              echo "❌ Invalid wheel:"
              echo "$NAME"
              exit 1
            fi
          done

          echo
          echo "✓ All wheels valid"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: pydantic-core v${{ needs.check-version.outputs.version }}
          make_latest: true
          generate_release_notes: true

          body: |
            ## Android / Termux Build

            **Package:** `${{ env.PACKAGE_NAME }}`

            **Version:** `${{ needs.check-version.outputs.version }}`

            **Commit:** `${{ needs.check-version.outputs.commit_hash }}`

            ### Architectures

            | Architecture | Android ABI |
            |---|---|
            | ARM64 | `android_24_arm64_v8a` |
            | ARMv7 | `android_24_armeabi_v7a` |

            ### Python

            - Python 3.9
            - Python 3.10
            - Python 3.11
            - Python 3.12
            - Python 3.13
            - Python 3.14

            ### Build Toolchain

            - Android NDK r25b
            - Android API 24
            - Rust
            - Maturin
            - Termux-compatible RPATH

            ### Installation

            Latest:

            ```bash
            curl -sL https://raw.githubusercontent.com/troublescope/android-pydantic-core/main/install_pydantic_core.sh | bash
            ```

            Specific version:

            ```bash
            curl -sL https://raw.githubusercontent.com/troublescope/android-pydantic-core/main/install_pydantic_core.sh | bash -s -- 2.46.5
            ```

          files: wheels/*.whl
