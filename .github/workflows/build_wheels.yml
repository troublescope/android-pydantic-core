name: Android Wheels & Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_wheels.yml"
      - "install_pydantic_core.sh"
      - "README.md"

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if release exists"
        required: false
        default: false
        type: boolean

      specific_version:
        description: "Build a specific pydantic-core version (leave empty for latest)"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 */6 * * *"

env:
  PACKAGE_NAME: pydantic-core

  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "24"

  CMDLINE_TOOLS_VERSION: "11076708"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

permissions:
  contents: write

jobs:

  check-version:
    name: Check PyPI Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should_build: ${{ steps.release.outputs.should_build }}
      commit_hash: ${{ steps.commit.outputs.commit_hash }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PyPI Version
        id: pypi
        shell: bash
        env:
          SPECIFIC_VER: ${{ inputs.specific_version }}
        run: |
          set -euo pipefail

          if [[ -n "${SPECIFIC_VER:-}" ]]; then
            VERSION="$SPECIFIC_VER"
            echo "Using requested version: $VERSION"
          else
            echo "Fetching latest pydantic-core from PyPI..."

            VERSION="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 5 \
                --connect-timeout 30 \
                "https://pypi.org/pypi/${PACKAGE_NAME}/json" |
              python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)
          print(data["info"]["version"])
          '
            )"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "Failed to determine package version"
            exit 1
          fi

          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.pypi.outputs.version }}"
          TAG="v${VERSION}"

          if [[ "${FORCE_BUILD:-false}" == "true" ]]; then
            echo "Force build enabled"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Commit
        id: commit
        shell: bash
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"


  build:
    name: Build ${{ matrix.arch }} / Python ${{ matrix.python-version }}

    needs:
      - check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

        arch:
          - arm64-v8a
          - armeabi-v7a

        include:

          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            ndk_lib_arch: aarch64-linux-android
            plat_tag: linux_aarch64

          - arch: armeabi-v7a
            rust_target: armv7-linux-androideabi
            ndk_lib_arch: arm-linux-androideabi
            plat_tag: linux_armv7l

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}


      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install maturin


      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --proto "=https" \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs |
            sh -s -- -y

          source "$HOME/.cargo/env"

          rustup target add "${{ matrix.rust_target }}"

          echo "Rust:"
          rustc --version

          echo "Cargo:"
          cargo --version


      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git

          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}

          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.arch }}-
            cargo-${{ runner.os }}-


      - name: Cache Android Command Line Tools
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/cmdline-tools/latest

          key: android-cmdline-${{ runner.os }}-${{ env.CMDLINE_TOOLS_VERSION }}


      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/ndk/${{ env.NDK_VERSION }}

          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}


      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"
          CMDLINE_DIR="$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$CMDLINE_DIR/bin/sdkmanager"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          echo "Checking sdkmanager..."

          if [[ ! -x "$SDKMANAGER" ]]; then

            echo "sdkmanager not found"
            echo "Installing Android command-line tools..."

            rm -rf "$CMDLINE_DIR"
            rm -rf /tmp/android-cmdline-tools
            rm -f /tmp/cmdline-tools.zip

            mkdir -p /tmp/android-cmdline-tools

            curl -fL \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              "${CMDLINE_TOOLS_URL}" \
              -o /tmp/cmdline-tools.zip

            unzip -q \
              /tmp/cmdline-tools.zip \
              -d /tmp/android-cmdline-tools

            if [[ ! -d "/tmp/android-cmdline-tools/cmdline-tools" ]]; then
              echo "Invalid Android command-line tools archive"
              find /tmp/android-cmdline-tools -maxdepth 3 -type f -print
              exit 1
            fi

            mv \
              /tmp/android-cmdline-tools/cmdline-tools \
              "$CMDLINE_DIR"
          fi

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager installation failed"

            echo "Android SDK contents:"
            find "$ANDROID_HOME" -maxdepth 5 -type f -print || true

            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$CMDLINE_DIR/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_HOME/ndk/${NDK_VERSION}"

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found:"
            echo "$SDKMANAGER"

            find "$ANDROID_HOME" \
              -maxdepth 6 \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [[ ! -d "$NDK_DIR" ]]; then
            echo "Installing NDK ${NDK_VERSION}..."

            "$SDKMANAGER" \
              "platform-tools" \
              "platforms;android-${ANDROID_API}" \
              "ndk;${NDK_VERSION}"
          else
            echo "NDK ${NDK_VERSION} already exists"
          fi

          if [[ ! -d "$NDK_DIR" ]]; then
            echo "NDK installation failed"
            exit 1
          fi

          if [[ ! -d "$ANDROID_HOME/platforms/android-${ANDROID_API}" ]]; then
            echo "Android API ${ANDROID_API} platform not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "NDK:"
          cat "$NDK_DIR/source.properties"

          echo "ANDROID_NDK_HOME:"
          echo "$NDK_DIR"


      - name: Verify Android Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo
          echo "sdkmanager:"
          "$SDKMANAGER" --version

          echo
          echo "clang:"
          "$NDK_BIN/clang" --version

          echo
          echo "Available Android targets:"
          "$SDKMANAGER" --list_installed | head -100


      - name: Build Wheel
        id: build_step
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          PY_VER="${{ matrix.python-version }}"
          PKG_VER="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          RUST_TARGET="${{ matrix.rust_target }}"
          NDK_LIB_ARCH="${{ matrix.ndk_lib_arch }}"
          PLAT_TAG="${{ matrix.plat_tag }}"

          export ANDROID_API_LEVEL="${ANDROID_API}"

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          export PATH="$NDK_BIN:$PATH"

          case "$ARCH" in

            arm64-v8a)
              CC_TARGET="aarch64-linux-android${ANDROID_API_LEVEL}"
              ;;

            armeabi-v7a)
              CC_TARGET="armv7a-linux-androideabi${ANDROID_API_LEVEL}"
              ;;

            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;

          esac

          echo "========================================="
          echo "Package:       $PKG_VER"
          echo "Architecture:  $ARCH"
          echo "Python:        $PY_VER"
          echo "Rust target:   $RUST_TARGET"
          echo "CC target:     $CC_TARGET"
          echo "Platform tag:  $PLAT_TAG"
          echo "========================================="


          CLANG="$NDK_BIN/${CC_TARGET}-clang"

          if [[ ! -x "$CLANG" ]]; then
            echo "Clang wrapper not found:"
            echo "$CLANG"

            echo
            echo "Available clang wrappers:"
            find "$NDK_BIN" \
              -maxdepth 1 \
              -type f \
              -name "*android*clang" \
              -print | head -50

            exit 1
          fi

          echo "Using linker:"
          echo "$CLANG"


          LINKER_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"

          export "${LINKER_VAR}=$CLANG"


          MOCK_DIR="$(pwd)/mock_libs"

          mkdir -p "$MOCK_DIR"


          echo "Creating mock libpython..."

          "$NDK_BIN/clang" \
            --target="$CC_TARGET" \
            -shared \
            -Wl,-soname,libpython${PY_VER}.so \
            -o "$MOCK_DIR/libpython${PY_VER}.so" \
            -xc /dev/null


          echo "Finding libdl.so..."

          LIBDL_PATH="$(
            find "$NDK_SYSROOT" \
              -path "*${NDK_LIB_ARCH}*" \
              -name "libdl.so" |
            head -n 1
          )"

          if [[ -z "$LIBDL_PATH" ]]; then
            echo "libdl.so not found"

            find "$NDK_SYSROOT" \
              -name "libdl.so" \
              -print | head -50

            exit 1
          fi

          echo "libdl:"
          echo "$LIBDL_PATH"

          cp "$LIBDL_PATH" "$MOCK_DIR/libdl.so"


          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"


          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<'PYEOF'
          build_time_vars = {
              'abiflags': '',
              'ABIFLAGS': '',
              'SO': '.so',
              'SOABI': 'cpython-PYVER_PLACEHOLDER',
              'EXT_SUFFIX': '.so',
              'LIBDIR': 'MOCKDIR_PLACEHOLDER',
              'LDLIBRARY': 'libpythonPYVER_PLACEHOLDER.so',
              'Py_ENABLE_SHARED': 1,
              'CC': 'clang',
              'CXX': 'clang++',
              'VERSION': 'PYVER_PLACEHOLDER',
              'LDSHARED': 'clang -shared',
              'LDFLAGS': '-LMOCKDIR_PLACEHOLDER',
              'CCSHARED': '-fPIC',
              'GNULD': 'yes',
              'Py_DEBUG': 0,
              'WITH_PYMALLOC': 1,
          }
          PYEOF


          sed -i \
            -e "s|PYVER_PLACEHOLDER|$PY_VER|g" \
            -e "s|MOCKDIR_PLACEHOLDER|$MOCK_DIR|g" \
            "$MOCK_DIR/${SYSCONFIG_NAME}.py"


          echo "Sysconfig:"
          cat "$MOCK_DIR/${SYSCONFIG_NAME}.py"


          mkdir -p build_src

          cd build_src


          echo "Fetching source for pydantic-core $PKG_VER..."


          SOURCE_URL="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              "https://pypi.org/pypi/${PACKAGE_NAME}/${PKG_VER}/json" |
            python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          urls = [
              x["url"]
              for x in data["urls"]
              if x["packagetype"] == "sdist"
          ]

          if not urls:
              raise SystemExit("No source distribution found")

          print(urls[0])
          '
          )"


          if [[ -z "$SOURCE_URL" ]]; then
            echo "Source URL not found"
            exit 1
          fi


          echo "Downloading:"
          echo "$SOURCE_URL"


          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            "$SOURCE_URL" \
            -o source.tar.gz


          tar -xzf source.tar.gz


          SOURCE_DIR="$(find . -maxdepth 1 -type d -name 'pydantic_core-*' | head -n 1)"

          if [[ -z "$SOURCE_DIR" ]]; then
            echo "Extracted source directory not found"
            exit 1
          fi

          cd "$SOURCE_DIR"


          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"
          export PYTHONPATH="$MOCK_DIR${PYTHONPATH:+:$PYTHONPATH}"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"


          RUSTFLAGS_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"

          export "${RUSTFLAGS_VAR}=-L native=$MOCK_DIR \
          -C link-arg=--target=$CC_TARGET \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython$PY_VER \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"


          echo
          echo "Build environment:"
          echo "PYO3_CROSS_LIB_DIR=$PYO3_CROSS_LIB_DIR"
          echo "PYO3_CROSS_PYTHON_VERSION=$PYO3_CROSS_PYTHON_VERSION"
          echo "RUST_TARGET=$RUST_TARGET"
          echo "CC_TARGET=$CC_TARGET"


          echo
          echo "Starting maturin build..."


          maturin build \
            --release \
            --strip \
            --target "$RUST_TARGET" \
            --interpreter "python${PY_VER}" \
            --skip-auditwheel


          cd target/wheels


          shopt -s nullglob

          WHEELS=( *.whl )


          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "No wheel was generated"
            exit 1
          fi


          echo
          echo "Generated wheels:"

          for WHEEL in "${WHEELS[@]}"; do
            ls -lh "$WHEEL"
          done


          for OLD in "${WHEELS[@]}"; do

            BASE="${OLD%.whl}"

            NEW="${BASE}-${PLAT_TAG}.whl"

            if [[ "$OLD" != "$NEW" ]]; then
              echo "Renaming:"
              echo "  $OLD"
              echo "  $NEW"

              mv "$OLD" "$NEW"
            fi

          done


          echo
          echo "Final wheels:"

          ls -lah *.whl


          echo "WHEEL_DIR=$(pwd)" >> "$GITHUB_OUTPUT"


      - name: Validate Wheels
        shell: bash
        run: |
          set -euo pipefail

          WHEEL_DIR="${{ steps.build_step.outputs.WHEEL_DIR }}"

          echo "Wheel directory:"
          echo "$WHEEL_DIR"

          mapfile -t WHEELS < <(
            find "$WHEEL_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.whl"
          )

          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "No wheels found"
            exit 1
          fi

          for WHEEL in "${WHEELS[@]}"; do
            echo
            echo "Wheel:"
            ls -lh "$WHEEL"
          done


      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-${{ matrix.arch }}
          path: ${{ steps.build_step.outputs.WHEEL_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1


  release:
    name: Create GitHub Release

    needs:
      - check-version
      - build

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download Wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true


      - name: Validate Release Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Release wheels:"

          find wheels \
            -type f \
            -name "*.whl" \
            -exec ls -lh {} \;


          COUNT="$(
            find wheels \
              -type f \
              -name "*.whl" |
            wc -l
          )"


          echo
          echo "Total wheels: $COUNT"


          if [[ "$COUNT" -eq 0 ]]; then
            echo "No wheels available for release"
            exit 1
          fi


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: pydantic-core v${{ needs.check-version.outputs.version }}

          generate_release_notes: true
          make_latest: true

          body: |
            ### Android / Termux Build

            **Package:** `${{ env.PACKAGE_NAME }}`

            **Version:** `${{ needs.check-version.outputs.version }}`

            **Built from commit:** `${{ needs.check-version.outputs.commit_hash }}`

            ### Architectures

            | Architecture | Android ABI |
            |---|---|
            | `linux_aarch64` | arm64-v8a |
            | `linux_armv7l` | armeabi-v7a |

            ### Python Versions

            - Python 3.9
            - Python 3.10
            - Python 3.11
            - Python 3.12
            - Python 3.13
            - Python 3.14

            ### Build Environment

            - Android NDK r25b
            - Android API 24
            - Rust
            - Maturin
            - Termux-compatible RPATH

            ### Installation

            ```bash
            curl -sL https://raw.githubusercontent.com/troublescope/android-pydantic-core/main/install_pydantic_core.sh | bash
            ```

            Or manually:

            ```bash
            pip install ./pydantic_core-*.whl
            ```

          files: wheels/*.whl
