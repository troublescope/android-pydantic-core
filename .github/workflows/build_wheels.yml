name: Android Wheels & Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_wheels.yml"
      - "install_pydantic_core.sh"
      - "README.md"

  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if release exists"
        required: false
        default: false
        type: boolean
      specific_version:
        description: "Build a specific pydantic-core version (leave empty for latest)"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "0 */6 * * *"

env:
  PACKAGE_NAME: pydantic-core
  NDK_VERSION: "25.2.9519653"
  ANDROID_API: "24"
  CMDLINE_TOOLS_VERSION: "11076708"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

permissions:
  contents: write

jobs:
  check-version:
    name: Check PyPI Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.pypi.outputs.version }}
      should_build: ${{ steps.check_release.outputs.should_build }}
      commit_hash: ${{ steps.commit.outputs.commit_hash }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Latest PyPI Version
        id: pypi
        env:
          SPECIFIC_VER: ${{ inputs.specific_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${SPECIFIC_VER:-}" ]]; then
            VER="$SPECIFIC_VER"
            echo "Using specified version: $VER"
          else
            echo "Fetching latest version from PyPI..."

            VER="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 10 \
                --connect-timeout 30 \
                "https://pypi.org/pypi/${PACKAGE_NAME}/json" |
              python3 -c 'import sys,json; print(json.load(sys.stdin)["info"]["version"])'
            )"
          fi

          if [[ -z "$VER" ]]; then
            echo "Failed to determine package version"
            exit 1
          fi

          echo "Version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check if Release Already Exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_build }}
        shell: bash
        run: |
          set -euo pipefail

          VER="${{ steps.pypi.outputs.version }}"
          TAG="v${VER}"

          if [[ "${FORCE:-false}" == "true" ]]; then
            echo "Force build enabled"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record Commit Hash
        id: commit
        shell: bash
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} / Python ${{ matrix.python-version }}
    needs: check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

        arch:
          - arm64-v8a
          - armeabi-v7a

        include:
          - arch: arm64-v8a
            rust_target: aarch64-linux-android
            ndk_lib_arch: aarch64-linux-android
            plat_tag: linux_aarch64

          - arch: armeabi-v7a
            rust_target: armv7-linux-androideabi
            ndk_lib_arch: arm-linux-androideabi
            plat_tag: linux_armv7l

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail

          curl --proto "=https" \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs |
            sh -s -- -y

          source "$HOME/.cargo/env"

          rustup target add "${{ matrix.rust_target }}"

          echo "Rust:"
          rustc --version
          cargo --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.python-version }}-
            cargo-${{ runner.os }}-${{ matrix.arch }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/android-sdk/cmdline-tools/latest
            ~/android-sdk/ndk/${{ env.NDK_VERSION }}
          key: android-${{ runner.os }}-cmdline-${{ env.CMDLINE_TOOLS_VERSION }}-ndk-${{ env.NDK_VERSION }}

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [[ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

            curl -fsSL \
              "${{ env.CMDLINE_TOOLS_URL }}" \
              -o /tmp/cmdline-tools.zip

            unzip -q /tmp/cmdline-tools.zip \
              -d /tmp/android-cmdline-tools

            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv \
              /tmp/android-cmdline-tools/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          sdkmanager --version

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="$HOME/android-sdk"

          if [[ ! -d "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" ]]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "ndk;${{ env.NDK_VERSION }}"
          fi

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

          echo "NDK:"
          "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/source.properties"

      - name: Build Wheel
        id: build_step
        shell: bash
        run: |
          set -euo pipefail

          source "$HOME/.cargo/env"

          PY_VER="${{ matrix.python-version }}"
          PKG_VER="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          RUST_TARGET="${{ matrix.rust_target }}"
          PLAT_TAG="${{ matrix.plat_tag }}"
          NDK_LIB_ARCH="${{ matrix.ndk_lib_arch }}"

          export ANDROID_API_LEVEL="${{ env.ANDROID_API }}"

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          NDK_SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

          export PATH="$NDK_BIN:$PATH"

          case "$ARCH" in
            arm64-v8a)
              CC_TARGET="aarch64-linux-android${ANDROID_API_LEVEL}"
              ;;
            armeabi-v7a)
              CC_TARGET="armv7a-linux-androideabi${ANDROID_API_LEVEL}"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          echo "========================================="
          echo "Package:      $PKG_VER"
          echo "Architecture: $ARCH"
          echo "Python:       $PY_VER"
          echo "Rust target:  $RUST_TARGET"
          echo "CC target:    $CC_TARGET"
          echo "Platform:     $PLAT_TAG"
          echo "========================================="

          CLANG="$NDK_BIN/${CC_TARGET}-clang"

          if [[ ! -x "$CLANG" ]]; then
            echo "Clang wrapper not found:"
            echo "$CLANG"
            exit 1
          fi

          LINKER_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          export "${LINKER_VAR}=$CLANG"

          echo "Linker: $CLANG"

          MOCK_DIR="$(pwd)/mock_libs"
          mkdir -p "$MOCK_DIR"

          echo "Creating mock libpython..."

          "$NDK_BIN/clang" \
            --target="$CC_TARGET" \
            -shared \
            -Wl,-soname,libpython${PY_VER}.so \
            -o "$MOCK_DIR/libpython${PY_VER}.so" \
            -xc /dev/null

          echo "Finding libdl..."

          LIBDL_PATH="$(
            find "$NDK_SYSROOT" \
              -path "*${NDK_LIB_ARCH}*" \
              -name "libdl.so" |
            head -n 1
          )"

          if [[ -z "$LIBDL_PATH" ]]; then
            echo "libdl.so not found"
            exit 1
          fi

          cp "$LIBDL_PATH" "$MOCK_DIR/libdl.so"

          SYSCONFIG_NAME="_sysconfigdata__linux_${RUST_TARGET}"

          cat > "$MOCK_DIR/${SYSCONFIG_NAME}.py" <<'PYEOF'
          build_time_vars = {
              'abiflags': '',
              'ABIFLAGS': '',
              'SO': '.so',
              'SOABI': 'cpython-PYVER_PLACEHOLDER',
              'EXT_SUFFIX': '.so',
              'LIBDIR': 'MOCKDIR_PLACEHOLDER',
              'LDLIBRARY': 'libpythonPYVER_PLACEHOLDER.so',
              'Py_ENABLE_SHARED': 1,
              'CC': 'clang',
              'CXX': 'clang++',
              'VERSION': 'PYVER_PLACEHOLDER',
              'LDSHARED': 'clang -shared',
              'LDFLAGS': '-LMOCKDIR_PLACEHOLDER',
              'CCSHARED': '-fPIC',
              'GNULD': 'yes',
              'Py_DEBUG': 0,
              'WITH_PYMALLOC': 1,
          }
          PYEOF

          sed -i \
            -e "s|PYVER_PLACEHOLDER|$PY_VER|g" \
            -e "s|MOCKDIR_PLACEHOLDER|$MOCK_DIR|g" \
            "$MOCK_DIR/${SYSCONFIG_NAME}.py"

          mkdir -p build_src
          cd build_src

          echo "Fetching pydantic-core $PKG_VER..."

          SOURCE_URL="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 10 \
              --connect-timeout 30 \
              "https://pypi.org/pypi/${PACKAGE_NAME}/${PKG_VER}/json" |
            python3 -c '
          import sys
          import json

          data = json.load(sys.stdin)

          urls = [
              x["url"]
              for x in data["urls"]
              if x["packagetype"] == "sdist"
          ]

          if not urls:
              raise SystemExit("No sdist found")

          print(urls[0])
          '
          )"

          echo "Source: $SOURCE_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 30 \
            "$SOURCE_URL" \
            -o source.tar.gz

          tar -xzf source.tar.gz

          cd pydantic_core-*/

          export PYO3_CROSS_LIB_DIR="$MOCK_DIR"
          export PYTHONPATH="$MOCK_DIR${PYTHONPATH:+:$PYTHONPATH}"
          export PYO3_CROSS_PYTHON_VERSION="$PY_VER"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONFIG_NAME"

          RUSTFLAGS_VAR="CARGO_TARGET_$(echo "$RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_RUSTFLAGS"

          export "${RUSTFLAGS_VAR}=-L native=$MOCK_DIR \
          -C link-arg=--target=$CC_TARGET \
          -C link-arg=-Wl,--no-as-needed \
          -C link-arg=-lpython$PY_VER \
          -C link-arg=-Wl,--as-needed \
          -C link-arg=-Wl,--unresolved-symbols=ignore-all \
          -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          echo "PYO3_CROSS_LIB_DIR=$PYO3_CROSS_LIB_DIR"
          echo "PYO3_CROSS_PYTHON_VERSION=$PYO3_CROSS_PYTHON_VERSION"

          echo "Building with maturin..."

          maturin build \
            --release \
            --strip \
            --target "$RUST_TARGET" \
            --interpreter "python${PY_VER}" \
            --skip-auditwheel

          cd target/wheels

          echo "Generated wheels:"
          ls -lah

          shopt -s nullglob

          WHEELS=( *.whl )

          if [[ ${#WHEELS[@]} -eq 0 ]]; then
            echo "No wheel generated"
            exit 1
          fi

          for OLD in "${WHEELS[@]}"; do
            NEW="${OLD%.whl}-${PLAT_TAG}.whl"

            if [[ "$OLD" != "$NEW" ]]; then
              echo "Renaming:"
              echo "  $OLD"
              echo "  $NEW"

              mv "$OLD" "$NEW"
            fi
          done

          echo "Final wheels:"
          ls -lah *.whl

          echo "WHEEL_DIR=$(pwd)" >> "$GITHUB_OUTPUT"

      - name: Validate Wheel
        shell: bash
        run: |
          set -euo pipefail

          WHEEL_DIR="${{ steps.build_step.outputs.WHEEL_DIR }}"

          find "$WHEEL_DIR" -name "*.whl" -print

          COUNT="$(find "$WHEEL_DIR" -name "*.whl" | wc -l)"

          if [[ "$COUNT" -lt 1 ]]; then
            echo "No wheel found"
            exit 1
          fi

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}-${{ matrix.arch }}
          path: ${{ steps.build_step.outputs.WHEEL_DIR }}/*.whl
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release

    needs:
      - check-version
      - build

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download All Wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true

      - name: List Wheels
        shell: bash
        run: |
          set -euo pipefail

          echo "Wheels:"
          find wheels -type f -name "*.whl" -print

          COUNT="$(find wheels -type f -name "*.whl" | wc -l)"

          echo "Total wheels: $COUNT"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "No wheels downloaded"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: pydantic-core v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            ### Android / Termux Build

            **Package:** `${{ env.PACKAGE_NAME }}`
            **Version:** `${{ needs.check-version.outputs.version }}`
            **Built from commit:** `${{ needs.check-version.outputs.commit_hash }}`

            #### Architectures

            | Architecture | Android ABI |
            |---|---|
            | `linux_aarch64` | arm64-v8a |
            | `linux_armv7l` | armeabi-v7a |

            #### Python

            - Python 3.9
            - Python 3.10
            - Python 3.11
            - Python 3.12
            - Python 3.13
            - Python 3.14

            #### Build Environment

            - Android NDK r25b
            - Android API 24
            - Rust
            - Maturin
            - Termux-compatible RPATH

            #### Installation

            ```bash
            curl -sL https://raw.githubusercontent.com/troublescope/android-pydantic-core/main/install_pydantic_core.sh | bash
            ```

            Or install a wheel manually:

            ```bash
            pip install ./pydantic_core-*.whl
            ```
          files: wheels/*.whl
